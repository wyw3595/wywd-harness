# ============================================================
# CI：离线测试门禁（生产级整理，2026-09-02）
# ============================================================
# 任何 push / PR 都跑一遍全部离线测试，挂了就不许合并。
# 真模型 / 真浏览器 / 真子进程链路的冒烟留在 scripts/smoke_*：需要密钥
# 或图形环境，不进 CI；判定"可发布"的门槛是全量离线测试全绿。
#
# 值得一提：pip install -e . --no-deps 这一行不是跑测试所必需
# （直接从 cwd 也能 import），它是在 CI 上验证 pyproject.toml
# 的打包配置没有写坏——声明文件只在干净环境里才验得了真身。

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # 项目开发机是 Python 3.13.9；矩阵顺带验证对旧版本的兼容。
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 测试真正 import 的运行时依赖：requests（RealModel）、fastapi + httpx
      # （web_app 运输层与其 TestClient；2026-09-25 迁移后 test_web_app 依赖）。
      - name: 安装依赖
        run: pip install requests fastapi httpx

      # 校验 pyproject 打包配置合法（见文件头说明）。
      - name: 校验 pyproject 并注册包
        run: pip install -e . --no-deps

      - name: 跑全部离线测试
        run: python -X utf8 -m unittest discover -s tests -v

  # ============================================================
  # 可选：reviewer 审查（2026-11-09）
  # ============================================================
  # 没有 DEEPSEEK_API_KEY 就整步跳过（不阻塞 fork PR / 无 secret 的仓库）。
  # 配置在 config/reviewer（可跟踪），本地 .workbuddy 那份仍是主开发用的。
  # 只把 blocker 当失败；报告作为 artifact 留下，便于人工看 major/minor。
  review:
    # 只审 PR：push 到 master 时 origin/master 就是 HEAD，没有可审区间。
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装审查依赖
        run: pip install requests

      - name: 取基线分支
        if: env.DEEPSEEK_API_KEY != ''
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'master' }}
        run: git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/$BASE_REF"

      - name: reviewer（只读，--fail-on blocker）
        if: env.DEEPSEEK_API_KEY != ''
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'master' }}
        run: |
          python -X utf8 scripts/review.py \
            --config-dir config/reviewer \
            --base "origin/$BASE_REF" \
            --head HEAD \
            --fail-on blocker \
            --out review.md

      - name: 上传审查报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewer-report
          path: review.md
          if-no-files-found: ignore