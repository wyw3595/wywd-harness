<!doctype html>
<html lang="zh-CN" data-page-node-id="o11MREXmxnu74KaGPHu9zd">
<head data-page-node-id="x2I1C6rvYurNmX2yEO2ImG">
<meta charset="utf-8" data-page-node-id="7jURvERlKMV087IUsg92mt">
<meta name="viewport" content="width=device-width, initial-scale=1" data-page-node-id="HiDjxpqzLbzFkCLMEALuAb">
<title>Harness Agent</title>
<!-- 空 data URI 图标：浏览器默认会去要 /favicon.ico，后端没有这个文件，
     控制台就常年挂一条 404。一行堵掉，控制台干净了才看得见真错误。 -->
<link rel="icon" href="data:," data-page-node-id="kYWS8AINdEDPYvFpT3XZ8J">
<style>
  /* ══════════════════════════════════════════════════════════
     设计 token —— 仿 Codex 的单色系：主按钮就是墨黑，没有彩色主题色；
     颜色全部走变量，深色只是同一套 token 的另一组取值（不复制结构样式）。
     ══════════════════════════════════════════════════════════ */
  :root{
    --bg:#ffffff;
    --panel:#f9f9f9;          /* 侧栏 / 抽屉 */
    --panel-hover:#f0f0f0;
    --surface:#ffffff;
    --line:#e6e6e6;
    --line-soft:#f0f0f0;
    --tx:#181818;
    --tx2:#6e6e6e;
    --tx3:#9b9b9b;
    --ink:#181818;            /* 单色主按钮 */
    --ink-fg:#ffffff;
    --user-bg:#f2f2f2;        /* 用户消息块 */
    --code-bg:#f7f7f8;
    --link:#0b62c4;
    --danger:#b3261e;
    --danger-bg:#fdf3f2;
    --warn:#8a6100;
    --warn-bg:#fdf8ec;
    --ok:#17683a;
    --shadow:0 1px 2px rgba(0,0,0,.05),0 10px 30px rgba(0,0,0,.09);
    --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Courier New",monospace;
    /* 尺寸：头部 46px 和 260px 侧栏是 Codex 桌面版的量级 */
    --hdr:46px;
    --sb:260px;
    --col:760px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#191919; --panel:#111111; --panel-hover:#232323;
      --surface:#1f1f1f; --line:#2e2e2e; --line-soft:#262626;
      --tx:#ececec; --tx2:#a3a3a3; --tx3:#6f6f6f;
      --ink:#ececec; --ink-fg:#141414;
      --user-bg:#262626; --code-bg:#0f0f0f; --link:#6cb6ff;
      --danger:#ff8a80; --danger-bg:#2a1c1b; --warn:#e3b341; --warn-bg:#2a2418;
      --ok:#5cc98a;
      --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.55);
    }
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--tx);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;
    display:flex;overflow:hidden;
  }
  button{font:inherit;color:inherit}
  /* 键盘可达性的地基：只给键盘聚焦画轮廓（鼠标点击不画），
     否则满屏 outline 会逼着人把它全局关掉——那就等于没有。 */
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;
    border:3px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--tx3);background-clip:content-box}
  ::-webkit-scrollbar-track{background:transparent}

  /* ══ 骨架 ══════════════════════════════════════════════ */
  #app{display:flex;flex:1;min-width:0;height:100%;position:relative}
  #main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}

  /* ══ 左栏：任务列表（Codex 的"项目/线程"区）════════════ */
  #sidebar{
    width:var(--sb);flex:0 0 var(--sb);display:flex;flex-direction:column;
    background:var(--panel);border-right:1px solid var(--line);
  }
  /* 折叠的语义随屏宽变：桌面 = 收成 52px 轨（列表还能点开）；
     窄屏 = 整条滑出屏幕（Codex 桌面版在手机上也是整屏抽屉）。
     两套规则分开写，别指望一条 `.collapsed` 兼顾两种含义。 */
  @media (min-width: 701px){
    #sidebar.collapsed{width:52px;flex:0 0 52px}
    #sidebar.collapsed .sb-name,
    #sidebar.collapsed #btn-create,
    #sidebar.collapsed #btn-refresh,
    #sidebar.collapsed .sb-search,
    #sidebar.collapsed #session-list,
    #sidebar.collapsed .sb-foot{display:none}
    #sidebar.collapsed .sb-head{justify-content:center;padding:0}
    #sidebar.collapsed .sb-head .flex{display:none}
  }
  .sb-head{display:flex;align-items:center;gap:2px;height:var(--hdr);
    padding:0 10px 0 12px;flex:0 0 var(--hdr);white-space:nowrap}
  .sb-head .flex{flex:1}
  .sb-name{font-size:13px;font-weight:600;letter-spacing:-.01em;color:var(--tx)}
  .icon-btn{
    border:0;background:transparent;color:var(--tx2);cursor:pointer;
    width:28px;height:28px;border-radius:7px;display:inline-flex;
    align-items:center;justify-content:center;font-size:14px;line-height:1;
    flex:0 0 auto;
  }
  .icon-btn:hover:not(:disabled){background:var(--panel-hover);color:var(--tx)}
  .icon-btn:disabled{opacity:.4;cursor:not-allowed}
  .sb-search{padding:0 10px 8px}
  .sb-search input{
    width:100%;background:var(--surface);color:var(--tx);
    border:1px solid var(--line);border-radius:9px;padding:6px 10px;
    font-size:13px;outline:none;font-family:inherit;
  }
  .sb-search input::placeholder{color:var(--tx3)}
  .sb-search input:focus{border-color:var(--tx3)}
  #session-list{flex:1;overflow-y:auto;padding:0 8px 8px}
  .row{padding:7px 9px;border-radius:9px;margin-bottom:2px;cursor:pointer;
    border:1px solid transparent}
  .row:hover{background:var(--panel-hover)}
  .row.cur{background:var(--surface);border-color:var(--line)}
  .row .r-title{display:flex;align-items:center;gap:7px;overflow:hidden}
  .row .r-tt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-size:13px;font-weight:500;letter-spacing:-.01em}
  .badge{font-size:10px;line-height:1.6;padding:0 6px;border-radius:999px;
    background:var(--panel-hover);color:var(--tx2);flex:0 0 auto;
    border:1px solid var(--line)}
  .row.cur .badge{background:var(--user-bg)}
  .badge.off{color:var(--tx3)}
  .row .r-meta{color:var(--tx3);font-size:11px;margin-top:2px;
    word-break:break-all;font-variant-numeric:tabular-nums}
  .row .r-ops{margin-top:5px;display:none;gap:4px}
  .row:hover .r-ops,.row.cur .r-ops{display:flex}
  .row .r-ops button{border:1px solid var(--line);background:var(--surface);
    color:var(--tx2);border-radius:6px;padding:1px 8px;cursor:pointer;
    font-size:11px;line-height:1.6}
  .row .r-ops button:hover{color:var(--tx);border-color:var(--tx3)}
  .row .r-ops .del:hover{color:var(--danger);border-color:var(--danger)}
  .row .r-ops button.arm{background:var(--danger);border-color:var(--danger);
    color:#fff;font-weight:600}
  .empty,.err{color:var(--tx3);padding:14px 8px;text-align:center;font-size:12px}
  .err{color:var(--danger)}
  .sb-foot{flex:0 0 auto;border-top:1px solid var(--line);padding:9px 12px;
    font-size:11px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-family:var(--mono)}

  /* ══ 工作区面板（侧栏底部，会话列表之下、项目标识之上）═══
     它和 .sb-foot 是一对：那条是"项目在哪"，这条是"模型在哪个目录里干活"。
     折叠侧栏时整块隐藏。 */
  .ws{flex:0 0 auto;border-top:1px solid var(--line)}
  #sidebar.collapsed .ws{display:none}
  .ws-head{display:flex;align-items:center;gap:2px;padding:7px 4px 2px 12px}
  .ws-title{font-size:11px;font-weight:600;color:var(--tx2);letter-spacing:.02em}
  .ws-head .flex{flex:1}
  .ws-head .icon-btn{width:22px;height:22px;font-size:12px}
  .ws-body{padding:1px 12px 9px;overflow:hidden}
  .ws-name{font-size:12px;color:var(--tx);overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .ws-path{font-size:11px;color:var(--tx3);font-family:var(--mono);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ══ 顶栏（46px，Codex 桌面版的头部量级）═══════════════ */
  #chat-head{
    display:flex;align-items:center;gap:8px;flex:0 0 var(--hdr);
    height:var(--hdr);padding:0 14px;border-bottom:1px solid var(--line);
    font-size:13px;color:var(--tx2);background:var(--bg);
  }
  #chat-head b{color:var(--tx);font-weight:600;letter-spacing:-.01em}
  #chat-head .tb-ghost{color:var(--tx3);font-weight:400}
  #stream-dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;
    background:var(--tx3);transition:background .2s}
  #stream-dot.on{background:var(--ok)}
  #stream-dot.off{background:var(--danger);animation:pulse 1.4s ease-in-out infinite}
  #stream-dot.idle{background:var(--tx3)}
  @keyframes pulse{50%{opacity:.3}}
  #cost-line{margin-left:auto;color:var(--tx3);font-size:11px;
    white-space:nowrap;cursor:help;font-variant-numeric:tabular-nums}

  /* ══ 对话区：内容居中成列（Codex/ChatGPT 的阅读宽度）═══ */
  #messages-wrap{flex:1;display:flex;flex-direction:column;
    position:relative;min-height:0}
  #messages{flex:1;overflow-y:auto;min-height:0;scrollbar-gutter:stable}
  .thread{max-width:var(--col);margin:0 auto;padding:22px 24px 8px;
    display:flex;flex-direction:column;gap:14px}
  #jump-bottom{position:absolute;left:50%;transform:translateX(-50%);
    bottom:14px;z-index:20;border:1px solid var(--line);background:var(--surface);
    color:var(--tx2);border-radius:999px;padding:5px 14px;font-size:12px;
    cursor:pointer;box-shadow:var(--shadow);white-space:nowrap}
  #jump-bottom:hover{color:var(--tx)}

  /* ══ 消息 ══════════════════════════════════════════════ */
  .msg{word-break:break-word;white-space:pre-wrap}
  /* 用户：右侧灰块（ChatGPT 血统，Codex 沿用了它） */
  .msg.user{
    align-self:flex-end;max-width:78%;background:var(--user-bg);
    border-radius:18px;padding:9px 15px;font-size:14.5px;
  }
  /* 助手：**不加气泡**，正文就是正文——满列宽的文字块比气泡好读得多，
     这也是 Codex/Claude 这类 agent 界面和聊天软件的差别所在 */
  .msg.assistant{max-width:100%;font-size:15px;line-height:1.72}
  .msg.system{align-self:stretch}
  /* 系统提示折起来（原生 details：语义 + 键盘可达都是白拿的） */
  .msg.system>summary{cursor:pointer;color:var(--tx3);font-size:12px;
    font-family:var(--mono);list-style:none;display:flex;align-items:center;
    gap:6px;width:fit-content;border-radius:6px;padding:1px 4px}
  .msg.system>summary::-webkit-details-marker{display:none}
  .msg.system>summary::before{content:"\25B8";font-size:10px;display:inline-block}
  .msg.system[open]>summary::before{content:"\25BE"}
  .msg.system>summary:hover{color:var(--tx2)}
  .msg.system .sys-body{margin-top:7px;padding:10px 12px;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;color:var(--tx2);
    font-size:11.5px;font-family:var(--mono);white-space:pre-wrap;
    max-height:320px;overflow-y:auto}
  /* 空状态（Codex 那种居中欢迎屏，不带任何装饰） */
  .thread-empty{margin:auto;padding:56px 0;text-align:center;color:var(--tx3)}
  .te-mark{color:var(--line);margin-bottom:14px}
  .te-title{font-size:15px;font-weight:600;color:var(--tx2);letter-spacing:-.01em}
  .te-sub{font-size:13px;margin-top:6px}
  .msg.tool{align-self:stretch;background:var(--code-bg);
    border:1px solid var(--line);border-radius:10px;padding:8px 12px;
    font-size:12px;color:var(--tx2);font-family:var(--mono);
    line-height:1.55;max-width:100%}
  .msg.tool .t-name{color:var(--tx3)}
  .msg .t-name{margin-right:.35em}
  /* 本轮结局卡：不是历史的一部分，所以样式也和正文区分开 */
  .msg.notice{align-self:stretch;border-radius:10px;padding:9px 12px;
    font-size:13px;display:flex;gap:9px;align-items:baseline;
    border:1px solid var(--line)}
  .msg.notice .n-tag{flex:0 0 auto;font-weight:600}
  .msg.notice .n-text{word-break:break-word}
  .msg.notice.lv-warn{background:var(--warn-bg);border-color:var(--line)}
  .msg.notice.lv-warn .n-tag{color:var(--warn)}
  .msg.notice.lv-error{background:var(--danger-bg)}
  .msg.notice.lv-error .n-tag{color:var(--danger)}

  /* ══ markdown（只作用于 .md-body）═════════════════════
     注意 white-space：.msg 上是 pre-wrap（纯文本靠它保换行），但 markdown
     已经把换行编译成 <br>/块级元素了，再叠一层 pre-wrap 会双倍行距。 */
  .msg.md-body{white-space:normal}
  .md-p{margin:0 0 12px}
  .md-p:last-child{margin-bottom:0}
  .md-h{margin:20px 0 8px;font-size:16px;font-weight:600;
    line-height:1.4;letter-spacing:-.01em}
  .md-h:first-child{margin-top:0}
  .md-list{margin:0 0 12px;padding-left:24px}
  .md-list:last-child{margin-bottom:0}
  .md-list li{margin:4px 0}
  .md-list li>.md-list{margin:4px 0 0}
  .md-quote{margin:0 0 12px;padding:2px 0 2px 14px;
    border-left:2px solid var(--line);color:var(--tx2)}
  .md-hr{border:0;border-top:1px solid var(--line);margin:18px 0}
  .md-code{font-family:var(--mono);font-size:.88em;
    background:var(--code-bg);border:1px solid var(--line-soft);
    border-radius:5px;padding:1px 5px}
  .md-pre-wrap{position:relative;margin:0 0 12px}
  .md-pre-wrap .md-pre{margin:0}
  .md-copy{position:absolute;top:8px;right:8px;border:1px solid var(--line);
    background:var(--surface);color:var(--tx2);border-radius:7px;
    padding:2px 9px;font-size:11px;cursor:pointer;opacity:0;
    transition:opacity .12s}
  .md-pre-wrap:hover .md-copy,.md-copy:focus-visible{opacity:1}
  .md-copy:hover{color:var(--tx)}
  .md-pre{padding:12px 14px;background:var(--code-bg);
    border:1px solid var(--line-soft);border-radius:10px;overflow-x:auto}
  .md-pre:last-child{margin-bottom:0}
  .md-pre code{font-family:var(--mono);font-size:12.5px;white-space:pre;
    line-height:1.6;color:var(--tx)}
  .md-body a{color:var(--link);text-decoration:underline;
    text-underline-offset:2px}

  /* ══ 本轮执行轨迹（内嵌在对话流里，跟随内容滚动）═══════ */
  /* 没内容时整块不出现——用显式类而不是 :empty，后者依赖模板里没有
     空白文本节点（Vue 的 condense 会去删，但那是编译器的行为，不该赌） */
  #live-feed.lf-hidden{display:none}
  #live-feed{background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:9px 12px;font-size:12px;color:var(--tx2)}
  #live-feed .lf-empty{color:var(--tx3);font-size:12px}
  #live-feed .lf-line{padding:2px 0;line-height:1.6;word-break:break-word;
    font-family:var(--mono);font-size:11.5px}
  #live-feed .lf-line .t-name{color:var(--tx);font-weight:600}
  #live-feed .lf-round{color:var(--tx3)}
  #live-feed .lf-model{color:var(--tx2)}
  /* 思考模式：比"决定调用"更淡（它不是回答，只是推理过程的痕迹） */
  #live-feed .lf-think{color:var(--tx3);font-style:italic;font-size:12px;
    word-break:break-all;white-space:pre-wrap}
  #live-feed .lf-think-tag{color:var(--tx2);font-style:normal;
    font-weight:600;font-size:11px}
  #live-feed .lf-out{padding-left:14px;color:var(--tx3)}
  #live-feed .lf-arrow{color:var(--tx3)}
  #live-feed .lf-end{color:var(--ok);padding-top:5px}
  #live-feed .lf-warn{color:var(--warn);padding-top:5px}
  #live-feed .lf-cost{color:var(--tx3);font-variant-numeric:tabular-nums}

  /* ══ composer（底部输入区）═════════════════════════════ */
  #input-bar{flex:0 0 auto;padding:8px 24px 16px;background:var(--bg)}
  #stream-warn{max-width:var(--col);margin:0 auto 8px;padding:7px 12px;
    font-size:12.5px;border-radius:10px;background:var(--danger-bg);
    border:1px solid var(--line);color:var(--tx)}
  .cp-box{max-width:var(--col);margin:0 auto;background:var(--surface);
    border:1px solid var(--line);border-radius:16px;padding:8px 10px 8px 14px;
    display:flex;align-items:flex-end;gap:8px;
    box-shadow:0 1px 2px rgba(0,0,0,.04);transition:border-color .15s,box-shadow .15s}
  .cp-box:focus-within{border-color:var(--tx3);
    box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px rgba(0,0,0,.07)}
  #input{flex:1;background:transparent;color:var(--tx);border:0;outline:none;
    font-family:inherit;font-size:14.5px;line-height:1.6;resize:none;
    max-height:200px;padding:6px 0;min-height:26px}
  #input::placeholder{color:var(--tx3)}
  #input:disabled{opacity:.5}
  #btn-send{flex:0 0 auto;width:32px;height:32px;border-radius:50%;border:0;
    background:var(--ink);color:var(--ink-fg);cursor:pointer;font-size:15px;
    line-height:1;display:inline-flex;align-items:center;justify-content:center}
  #btn-send:disabled{opacity:.28;cursor:not-allowed}
  .cp-hint{max-width:var(--col);margin:6px auto 0;font-size:11px;
    color:var(--tx3);text-align:center}

  /* ══ 审批卡（底部浮层；Codex 把权限确认做成卡片+明确动作）══ */
  #approval-overlay{position:fixed;left:0;right:0;bottom:0;top:0;
    display:none;z-index:100;pointer-events:none}
  #approval-card{
    pointer-events:auto;position:absolute;left:50%;transform:translateX(-50%);
    bottom:104px;width:min(560px,calc(100% - 48px));background:var(--surface);
    border:1px solid var(--line);border-radius:14px;padding:14px 16px;
    box-shadow:var(--shadow);
  }
  #approval-card .a-rule{color:var(--tx);font-weight:600;font-size:13px;
    font-family:var(--mono)}
  #approval-card .a-reason{color:var(--tx2);margin:7px 0 14px;font-size:13px;
    line-height:1.6;word-break:break-word}
  #approval-card .a-ops{display:flex;gap:8px;justify-content:flex-end}
  #approval-card button{border-radius:9px;padding:7px 16px;cursor:pointer;
    font-size:13px;font-weight:500;border:1px solid var(--line);
    background:var(--surface);color:var(--tx)}
  #approval-card button:hover:not(:disabled){background:var(--panel-hover)}
  #a-allow{background:var(--ink)!important;color:var(--ink-fg)!important;
    border-color:var(--ink)!important}
  #a-allow:hover:not(:disabled){opacity:.86}
  #a-reject:hover:not(:disabled){color:var(--danger);border-color:var(--danger)}
  #approval-card button:disabled{opacity:.45;cursor:not-allowed}

  /* ══ 目录选择弹层（后端列目录、前端自己画；不依赖桌面）══ */
  #fs-overlay{position:fixed;left:0;right:0;bottom:0;top:0;
    display:none;z-index:110;pointer-events:none}
  #fs-picker{
    pointer-events:auto;position:absolute;left:50%;transform:translateX(-50%);
    top:64px;width:min(520px,calc(100% - 48px));background:var(--surface);
    border:1px solid var(--line);border-radius:14px;padding:14px 16px;
    box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;
    max-height:min(560px,calc(100vh - 140px));
  }
  .fp-head{display:flex;align-items:center;gap:8px}
  .fp-title{font-size:13px;font-weight:600;color:var(--tx)}
  .fp-head .flex{flex:1}
  .fp-path{font-size:11px;color:var(--tx3);font-family:var(--mono);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    border:1px solid var(--line);border-radius:8px;padding:6px 8px}
