<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness Agent</title>
<style>
  :root{
    --bg:#10141c; --bg2:#161c26; --line:rgba(255,255,255,.1);
    --tx:#d7dde4; --dim:#8b949e; --accent:#8ec0ff; --accent-bg:rgba(88,166,255,.16);
    --danger:#ff7b72; --ok:#7ee787; --warn:#f2cc60;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--tx);
    font-family:"Segoe UI",system-ui,sans-serif;font-size:14px;
    display:flex;overflow:hidden;
  }
  /* ── 左栏会话列表 ─────────────────────────── */
  #sidebar{
    width:232px;flex:0 0 232px;display:flex;flex-direction:column;
    border-right:1px solid var(--line);background:var(--bg2);
  }
  .sb-head{
    display:flex;align-items:center;gap:6px;padding:10px;
    font-weight:600;border-bottom:1px solid var(--line);
  }
  .sb-head .flex{flex:1}
  .sb-head button{
    border:0;background:rgba(255,255,255,.12);color:inherit;cursor:pointer;
    border-radius:5px;padding:2px 8px;font-size:13px;
  }
  .sb-head button:hover{background:rgba(255,255,255,.25)}
  #session-list{flex:1;overflow-y:auto;padding:6px}
  .row{padding:7px 8px;border-radius:6px;margin-bottom:2px;cursor:pointer;
    border:1px solid transparent}
  .row:hover{background:rgba(255,255,255,.07)}
  .row.cur{background:var(--accent-bg);border-color:rgba(88,166,255,.45)}
  .row.foreign{opacity:.55;cursor:not-allowed}
  .row .r-title{display:flex;align-items:center;gap:6px;overflow:hidden}
  .row .r-tt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{font-size:10px;padding:1px 5px;border-radius:8px;
    background:rgba(88,166,255,.25);color:var(--accent)}
  .badge.off{background:rgba(255,255,255,.12);color:var(--dim)}
  .row .r-meta{color:var(--dim);font-size:11px;margin-top:2px;word-break:break-all}
  .row .r-ops{margin-top:4px;display:flex;gap:4px}
  .row .r-ops button{border:0;background:rgba(255,255,255,.12);color:inherit;
    border-radius:4px;padding:1px 7px;cursor:pointer;font-size:11px}
  .row .r-ops button:hover{background:rgba(255,255,255,.25)}
  .row .r-ops .del:hover{background:rgba(255,107,107,.35)}
  .row .r-ops button.arm{background:rgba(255,107,107,.55);font-weight:600}
  .empty,.err{color:var(--dim);padding:10px 6px;text-align:center;font-size:12px}
  .err{color:var(--danger)}
  /* ── 聊天区 ───────────────────────────────── */
  #main{flex:1;display:flex;flex-direction:column;min-width:0}
  #chat-head{
    padding:10px 16px;border-bottom:1px solid var(--line);
    font-size:12px;color:var(--dim);
  }
  #chat-head b{color:var(--tx)}
  #messages{flex:1;overflow-y:auto;padding:16px}
  .msg{max-width:72%;margin-bottom:10px;line-height:1.6;
    word-break:break-word;white-space:pre-wrap}
  .msg.user{margin-left:auto;background:rgba(88,166,255,.18);
    border:1px solid rgba(88,166,255,.35);border-radius:10px;padding:8px 12px}
  .msg.assistant{margin-right:auto;background:var(--bg2);
    border:1px solid var(--line);border-radius:10px;padding:8px 12px}
  .msg.system{max-width:100%;color:var(--dim);font-style:italic;font-size:12px}
  .msg.tool{
    margin-right:auto;max-width:88%;background:rgba(255,255,255,.04);
    border-left:3px solid var(--warn);border-radius:4px;padding:6px 10px;
    font-size:12px;color:var(--dim);
  }
  .msg.tool .t-name{color:var(--warn);font-weight:600}
  .msg.assistant.streaming::after{content:"▍";animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  #live-feed{padding:0 16px 4px}
  #live-feed .lf-empty{color:var(--dim);font-size:12px;padding:2px 0}
  /* ── 输入栏 ───────────────────────────────── */
  #input-bar{display:flex;gap:8px;padding:12px 16px;
    border-top:1px solid var(--line);background:var(--bg2)}
  #input{flex:1;background:var(--bg);color:var(--tx);border:1px solid var(--line);
    border-radius:8px;padding:9px 12px;font-size:14px;outline:none}
  #input:focus{border-color:rgba(88,166,255,.5)}
  #input:disabled{opacity:.5}
  #btn-send{border:0;background:var(--accent);color:#0b1220;cursor:pointer;
    border-radius:8px;padding:0 18px;font-size:14px;font-weight:600}
  #btn-send:disabled{opacity:.5;cursor:not-allowed}
  /* ── 审批卡（底部浮层）──────────────────────── */
  #approval-overlay{position:fixed;left:16px;right:16px;bottom:76px;
    display:none;z-index:100}
  #approval-card{
    margin:0 auto;max-width:520px;background:rgba(30,48,80,.97);
    border:1px solid rgba(88,166,255,.5);border-radius:10px;padding:12px 14px;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  #approval-card .a-rule{color:var(--warn);font-weight:600;font-size:13px}
  #approval-card .a-reason{color:var(--tx);margin:6px 0 10px;font-size:13px;
    line-height:1.5;word-break:break-word}
  #approval-card .a-ops{display:flex;gap:8px}
  #approval-card button{flex:1;border:0;border-radius:6px;padding:7px 0;
    cursor:pointer;font-size:13px;font-weight:600}
  #a-allow{background:#2ea043;color:#fff}
  #a-reject{background:#da3633;color:#fff}
  #approval-card button:disabled{opacity:.5;cursor:not-allowed}
  #toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);
    background:rgba(30,36,48,.98);border:1px solid var(--line);border-radius:6px;
    padding:8px 14px;font-size:12px;max-width:70%;z-index:200;display:none}
</style>
</head>
<body>

<aside id="sidebar">
  <div class="sb-head">
    <span>🗂 会话</span>
    <span class="flex"></span>
    <button id="btn-create" title="新建会话">＋</button>
    <button id="btn-refresh" title="刷新">↻</button>
  </div>
  <div id="session-list"></div>
</aside>

<main id="main">
  <header id="chat-head">（未选择会话）</header>
  <div id="messages"></div>
  <div id="live-feed"><div class="lf-empty">—</div></div>
  <div id="input-bar">
    <input id="input" placeholder="输入消息…（Enter 发送）" autocomplete="off" disabled>
    <button id="btn-send" disabled>发送</button>
  </div>
</main>

<div id="approval-overlay">
  <div id="approval-card">
    <div class="a-rule"></div>
    <div class="a-reason"></div>
    <div class="a-ops">
      <button id="a-allow">✅ 允许</button>
      <button id="a-reject">⛔ 拒绝</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script src="/app.js"></script>
</body>
</html>
